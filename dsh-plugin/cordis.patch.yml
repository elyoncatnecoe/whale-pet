# dsh-plugin-whale-pet-desktop 的 bundle patch。
# DSH 通过 package.json 的 dsh.bundle.patch 找到本文件，把插件挂进 profile。
#
# 用 insert: 包裹（裸 `- id:` 只会覆盖已有行，对不存在的 id 会报
# patch: entry "..." not found）。
#
# id 带 -desktop 后缀：DSH 按 id 区分加载条目，用独有 id 就能和
# 其他宠物插件共存，不会互相顶掉。
- insert:
    - id: whale-pet-desktop
      name: "dsh-plugin-whale-pet-desktop"
