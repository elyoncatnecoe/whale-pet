# 3D小虎鲸的 bundle patch（DSH 通过 package.json 的 dsh.bundle.patch 找到本文件）。
#
# 用 insert: 包裹（裸 `- id:` 只会覆盖已有行，对不存在的 id 会报
# patch: entry "..." not found）。
#
# id 用独有值：DSH 的插件加载器按 id 区分条目，用独有 id 就能和别的
# 宠物插件（例如网页版「小鲸鱼」）共存，不会互相顶掉。
#
# name 用相对本文件的路径指向 Host 半边入口。DSH 的规则是「插入行里的
# 相对模块名相对 patch 文件所在目录解析」，而 patch 在 <包根>/dsh-plugin/。
# 注意必须指到具体 .js 文件：Node 的 ESM 解析不支持目录导入（会报
# ERR_UNSUPPORTED_DIR_IMPORT）。
#
# 这样写的好处：无论用户从仓库根安装（包名 3d-whale-pet）还是从本子目录
# 安装（包名 3d-whale-pet-desktop），都能解析到同一入口。
- insert:
    - id: 3d-whale-pet-desktop
      name: "./lib/index.js"
